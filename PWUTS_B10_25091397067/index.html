<!DOCTYPE html>
<html lang="id">
<head>

<link rel="icon" href="images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<header class="top">
  <div class="wrap bar">
    <a href="#beranda" class="brand"><img src="images/logo.svg" alt="" width="40" height="40">ResepKita</a>
    <button id="burger" aria-label="Buka menu" aria-expanded="false">☰</button>

<section class="hero">

    <h1 id="judul">Resep Rumahan Favorit Keluarga</h1>

      <input id="q" type="search" placeholder="Ketik resep atau bahan, misalnya telur" aria-label="Cari resep atau bahan">
      <button class="btn" type="submit">Cari</button>
    </form>
  </div>
</section>

<main class="wrap">

      <div class="shead"><h2>Resep Pilihan Hari Ini</h2><a class="btn ghost" href="#katalog">Semua Resep</a></div>

</div>
