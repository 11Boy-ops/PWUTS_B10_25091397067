<section class="formbox">
  <h2>Unggah Resep</h2>
  <p class="muted">Resep disimpan di browser ini dan langsung tampil di Katalog Resep. Data tidak dikirim ke server.</p>
  
  <form id="formResep" novalidate>
    
    <!-- Judul Resep -->
    <div class="fg">
      <label for="title">Judul resep</label>
      <input id="title" name="title" maxlength="150" placeholder="Contoh: Sambal Matah Bali">
      <span class="err"></span>
    </div>
    
    <!-- Kategori & Tingkat Kesulitan -->
    <div class="two">
      <div class="fg">
        <label for="category_id">Kategori</label>
        <select id="category_id" name="category_id">
          <option value="">Pilih kategori</option>
        </select>
        <span class="err"></span>
      </div>
      
      <div class="fg">
        <label for="difficulty">Tingkat kesulitan</label>
        <select id="difficulty" name="difficulty">
          <option value="">Pilih tingkat</option>
          <option value="mudah">Mudah</option>
          <option value="sedang">Sedang</option>
          <option value="sulit">Sulit</option>
        </select>
        <span class="err"></span>
      </div>
    </div>
    
    <!-- Deskripsi Singkat -->
    <div class="fg">
      <label for="description">Deskripsi singkat</label>
      <textarea id="description" name="description" rows="3" placeholder="Ceritakan rasa dan keistimewaan resep ini (minimal 20 karakter)"></textarea>
      <span class="err"></span>
    </div>
    
    <!-- Jumlah Porsi & Waktu Memasak -->
    <div class="two">
      <div class="fg">
        <label for="servings">Jumlah porsi</label>
        <input id="servings" name="servings" type="number" min="1" max="50" placeholder="4">
        <span class="err"></span>
      </div>
      
      <div class="fg">
        <label for="cook_time">Waktu memasak (menit)</label>
        <input id="cook_time" name="cook_time" type="number" min="1" max="600" placeholder="30">
        <span class="err"></span>
      </div>
    </div>
    
    <!-- Foto Utama -->
    <div class="fg">
      <label for="photo">Foto utama (JPG, PNG, atau WEBP, maks. 2 MB)</label>
      <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp">
      <span class="err"></span>
      <img id="prev" class="prev" alt="Pratinjau foto" hidden>
    </div>
    
    <!-- Bahan dan Takaran -->
    <div class="fg" id="gB">
      <label>Bahan dan takaran</label>
      <div id="listB"></div>
      <span class="err"></span>
      <button type="button" id="addB" class="btn ghost sm">Tambah bahan</button>
    </div>
    
    <!-- Langkah Memasak -->
    <div class="fg" id="gL">
      <label>Langkah memasak</label>
      <div id="listL"></div>
      <span class="err"></span>
      <button type="button" id="addL" class="btn ghost sm">Tambah langkah</button>
    </div>
    
    <!-- Status & Submit -->
    <p id="hasil" class="note" role="status" hidden></p>
    <button id="kirim" class="btn" type="submit">Simpan Resep</button>
    
  </form>
</section>
